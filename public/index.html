<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Euskara Praktika</title>
<meta name="theme-color" content="#C8281F">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Euskara">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="olentzero.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Work+Sans:wght@500;600;700&display=swap">
<style>
/* Jaia: cartel de fiestas y serigrafía. Bloques planos con borde negro, sin sombras.
   Regla bilingüe: euskera arriba en condensada; castellano debajo, pequeño. */
:root{
  --bg:#FFF9EC; --card:#FFF9EC; --ink:#141414; --muted:#5A5A5A; --line:#141414; --soft:#EFE6D2;
  --red:#C8281F; --red-deep:#A11F18; --red-soft:#F7D9D6; --green:#15733A; --green-deep:#0F5A2D; --green-soft:#D7EBDD;
  --ochre:#F2C230; --ochre-soft:#FBEBB8; --cream:#FFF9EC; --blue:#1F4E79; --blue-soft:#DCE7F3; --on-color:rgba(255,249,236,.88);
  --display:'Anton',Impact,'Arial Narrow',sans-serif; --body:'Work Sans',system-ui,-apple-system,sans-serif; --r:0px; --bw:3px; color-scheme:light;
}
@media (prefers-color-scheme:dark){ :root{ --bg:#141414; --card:#1C1C1C; --ink:#FFF9EC; --muted:#B8B8B8; --line:#FFF9EC; --soft:#2A2A2A; --red:#C8281F; --red-deep:#A11F18; --red-soft:#4A1F1B; --green:#15733A; --green-deep:#0F5A2D; --green-soft:#1C3A27; --ochre:#F2C230; --ochre-soft:#4A3C12; --cream:#FFF9EC; --blue:#7FA8DA; --blue-soft:#1F2E42; --on-color:rgba(255,249,236,.88); color-scheme:dark } }
@media (prefers-color-scheme:dark){ .tabs{border-top-color:#FFF9EC} .toast{border-color:#141414;background:#FFF9EC;color:#141414} .stab td.win,.drill .instr{color:#F2C230} }
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.4;-webkit-font-smoothing:antialiased}
.app{max-width:560px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
body.notabs .app{padding-bottom:0}
.pad{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--display);font-weight:400;margin:0;text-wrap:balance;line-height:1;letter-spacing:.01em;text-transform:uppercase}
h1{font-size:40px} h2{font-size:28px} h3{font-size:20px}
p{margin:0}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--ochre);outline-offset:2px}
/* botones: bloque plano con borde */
.btn{display:flex;flex-direction:column;align-items:center;justify-content:center;width:100%;padding:14px 16px;border:var(--bw) solid var(--line);background:var(--green);color:var(--cream);font-family:var(--display);font-size:22px;line-height:1;text-transform:uppercase;letter-spacing:.02em;text-align:center}
.btn small{display:block;font-family:var(--body);font-size:11px;font-weight:600;text-transform:none;letter-spacing:0;color:var(--on-color);margin-top:3px}
.btn.red{background:var(--red)}
.btn.ghost{background:var(--card);color:var(--ink)} .btn.ghost small{color:var(--muted)}
.btn.sm{padding:9px 12px;font-size:16px;width:auto;display:inline-flex}
.btn:disabled{opacity:.35}
.btn:active{transform:translate(1px,1px)}
/* etiquetas de sección bilingües */
.eyebrow{display:flex;flex-direction:column;font-family:var(--display);font-size:16px;letter-spacing:.04em;text-transform:uppercase;color:var(--ink);line-height:1.05}
.eyebrow::after{content:attr(data-es);font-family:var(--body);font-size:11px;font-weight:600;letter-spacing:0;text-transform:none;color:var(--muted);margin-top:2px}
.eyebrow:not([data-es])::after{content:none}
.muted{color:var(--muted)}
.card{background:var(--card);border:var(--bw) solid var(--line);padding:16px}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;align-items:center;gap:12px}
.spacer{flex:1}
.err{color:var(--red);font-weight:700;min-height:1.4em}
.hint{font-size:13px;color:var(--muted);font-weight:500}
/* cabecera roja con lauburu */
.head{position:relative;overflow:hidden;background:var(--red);color:var(--cream);padding-top:calc(14px + env(safe-area-inset-top,0px));padding-bottom:18px;border-bottom:var(--bw) solid var(--line)}
.head .mascot{position:absolute;right:max(10px,env(safe-area-inset-right,0px));bottom:-14px;z-index:2}
.head .row{padding-right:78px}
.head .lb{position:absolute;right:-40px;top:10px;width:220px;height:220px;color:var(--cream);opacity:.16}
.head .lb svg{width:100%;height:100%}
.head .eyebrow,.head .eyebrow::after{color:var(--on-color)}
.head h1{font-size:34px}
.head .pill{border-color:var(--cream);background:transparent;color:var(--cream)}
.head .sub{margin-top:10px;font-size:13px;font-weight:600;color:var(--on-color);max-width:72%}
.hills{display:none}
.pill{display:inline-flex;align-items:center;gap:6px;padding:4px 9px;border:var(--bw) solid var(--line);font-family:var(--display);font-size:15px;letter-spacing:.02em;background:var(--card);color:var(--ink);white-space:nowrap;font-variant-numeric:tabular-nums}
.pill.g{background:var(--green);color:var(--cream)} .pill.b{background:var(--blue);color:var(--cream)} .pill.y{background:var(--ochre);color:#141414;border-color:#141414}
.avatar{width:42px;height:42px;border:var(--bw) solid var(--cream);background:transparent;color:var(--cream);display:grid;place-items:center;font-family:var(--display);font-size:20px;flex:none;cursor:pointer}
/* pestañas */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:15;background:#141414;border-top:var(--bw) solid #141414;padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
.tab{position:relative;display:flex;flex-direction:column;align-items:center;gap:1px;padding:10px 0 8px;color:#FFF9EC}
.tab .eu{font-family:var(--display);font-size:15px;letter-spacing:.06em;text-transform:uppercase;line-height:1;display:flex;align-items:center;gap:5px}
.tab .es{font-size:9px;font-weight:600;color:#B8B8B8}
.tab.on{color:var(--ochre)}
.tab svg{width:13px;height:13px}
.tab .badge{position:absolute;top:6px;right:14%;background:var(--red);color:#fff;font-size:11px;font-weight:700;padding:1px 6px;border:2px solid #141414}
/* lecciones */
.lesson{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--card);border:var(--bw) solid var(--line);padding:12px 14px}
.lesson .n{width:40px;height:40px;flex:none;display:grid;place-items:center;font-family:var(--display);font-size:20px;color:#FFF9EC;background:#141414;border:2px solid var(--line)}
.lesson.done .n{background:var(--green)}
.lesson .n b{font-weight:400}
.lesson .t{flex:1;min-width:0}
.lesson .t strong{display:block;font-family:var(--display);font-weight:400;font-size:19px;line-height:1.05;text-transform:uppercase}
.lesson .t small{display:block;color:var(--muted);font-size:12px;font-weight:600;margin-top:2px}
.sbar{display:flex;height:10px;border:2px solid var(--line);overflow:hidden;margin-top:8px;background:var(--card)}
.sbar i{display:block;height:100%} .sbar i.t{background:var(--green)} .sbar i.s{background:var(--ochre)}
.slegend{display:block;font-size:11px;color:var(--muted);font-weight:700;margin-top:4px}
/* ejercicio */
.top{display:flex;align-items:center;gap:12px;padding-top:calc(10px + env(safe-area-inset-top,0px));padding-bottom:12px;border-bottom:var(--bw) solid var(--line);margin-bottom:14px}
.top .bar{flex:1;height:14px;border:var(--bw) solid var(--line);overflow:hidden;background:var(--card)}
.top .bar i{display:block;height:100%;width:0;background:var(--green);transition:width .3s}
.top button[aria-label]{width:36px;height:36px;border:var(--bw) solid var(--line);font-family:var(--display);font-size:18px;display:grid;place-items:center;color:var(--ink)!important}
.prompt{font-family:var(--display);font-size:28px;font-weight:400;line-height:1.05;border:var(--bw) solid var(--line);background:var(--ochre);color:#141414;padding:14px 16px}
.prompt.eu{background:var(--red);color:var(--cream)}
.opts{display:grid;gap:10px}
.opt{text-align:left;padding:13px 14px;border:var(--bw) solid var(--line);background:var(--card);font-size:17px;font-weight:600}
.opt[aria-pressed="true"]{background:var(--ochre);color:#141414}
.opt.ok{background:var(--green);color:var(--cream)} .opt.bad{background:var(--red);color:var(--cream)}
input.ans,select.ans{width:100%;font:600 19px var(--body);padding:13px 14px;border:var(--bw) solid var(--line);background:var(--card);color:var(--ink);border-radius:0;-webkit-appearance:none}
input.ans.ok{border-color:var(--green);background:var(--green-soft)} input.ans.bad{border-color:var(--red);background:var(--red-soft)}
.helps{display:flex;gap:8px;flex-wrap:wrap}
.help{padding:8px 12px;border:var(--bw) solid var(--line);font-weight:700;font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink);background:var(--card)}
.help.on{background:var(--ochre);color:#141414}
.speak{display:inline-grid;place-items:center;width:40px;height:40px;border:var(--bw) solid var(--line);background:var(--card);color:var(--ink);flex:none}
.speak.big{width:88px;height:88px;margin:10px auto;background:var(--ochre);color:#141414}
.speak svg{width:20px;height:20px} .speak.big svg{width:40px;height:40px}
/* hoja de feedback */
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:20;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px calc(18px + env(safe-area-inset-bottom,0px));transform:translateY(110%);transition:transform .25s;max-height:85vh;overflow:auto;border-top:var(--bw) solid var(--line);color:var(--cream)}
.sheet.show{transform:none}
.sheet .in{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
.sheet.ok{background:var(--green)} .sheet.bad{background:var(--red)} .sheet.info{background:var(--ochre);color:#141414}
.sheet h3{font-family:var(--display);font-size:30px;text-transform:uppercase;color:inherit}
.sheet .hint{color:var(--on-color)} .sheet.info .hint{color:#5A5A5A}
.sheet .eyebrow{color:inherit} .sheet .eyebrow::after{color:var(--on-color)} .sheet.info .eyebrow::after{color:#5A5A5A}
.sheet .btn{background:#141414;color:#FFF9EC;border-color:#141414} .sheet.info .btn{background:#141414;border-color:#141414}
.sheet .btn small{color:#B8B8B8}
.sheet .btn:disabled{opacity:.45}
.sheet input.ans{border-color:#141414;background:#FFF9EC;color:#141414}
.sheet .speak{background:var(--ochre);color:#141414;border-color:#141414}
.sh-olen{flex:none;width:60px;height:88px;overflow:hidden}
.note{border:var(--bw) solid #141414;border-left-width:12px;border-left-color:var(--ochre);background:#FFF9EC;color:#141414;padding:10px 12px;font-size:14px;font-weight:600}
.answer-box{background:#FFF9EC;color:#141414;border:var(--bw) solid #141414;padding:12px 14px;display:flex;align-items:center;gap:10px}
.answer-box b{font-family:var(--display);font-weight:400;font-size:22px;line-height:1.05}
.bottom{position:sticky;bottom:0;z-index:5;padding-block:12px calc(12px + env(safe-area-inset-bottom,0px));background:var(--bg);border-top:var(--bw) solid var(--line);margin-top:14px}
.big{font-family:var(--display);font-size:64px;line-height:1;color:var(--cream);font-variant-numeric:tabular-nums}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--card);border:var(--bw) solid var(--line);padding:12px;text-align:center}
.stat b{display:block;font-family:var(--display);font-weight:400;font-size:32px;line-height:1;font-variant-numeric:tabular-nums}
.stat span{display:block;font-size:10px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.12em;margin-top:4px}
.stat.g{background:var(--green);color:var(--cream)} .stat.g span{color:var(--on-color)}
.link{color:var(--ink);font-weight:700;text-decoration:underline;text-underline-offset:3px;font-size:14px}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:7px 12px;border:var(--bw) solid var(--line);background:var(--card);font-weight:700;font-size:14px}
.chip.on{background:#141414;color:#FFF9EC;border-color:var(--line)}
@media (prefers-color-scheme:dark){ .chip.on{background:#FFF9EC;color:#141414} }
.pattern{background:#141414;color:#FFF9EC;padding:14px 16px;border:var(--bw) solid var(--line)}
.pattern .eyebrow,.pattern .eyebrow::after{color:var(--ochre)}
.pattern .pat{font-family:var(--display);font-size:32px;line-height:1.05;margin-top:6px}
.pattern .blank{color:var(--ochre);border-bottom:4px solid var(--ochre)}
.vocab{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.v{background:var(--card);border:var(--bw) solid var(--line);padding:12px;display:flex;flex-direction:column;gap:4px;min-width:0;position:relative;text-align:left;color:var(--ink)}
.v .em{font-size:28px;line-height:1}
.v .em.q{font-size:20px;letter-spacing:-2px;line-height:1.2;overflow-wrap:anywhere}
.v b{font-family:var(--display);font-weight:400;font-size:18px;line-height:1.05;overflow-wrap:anywhere}
.v small{color:var(--muted);font-size:12px;font-weight:600}
.v .tag{position:absolute;top:8px;right:8px;font-size:13px;line-height:1;display:inline-flex}
.v .tag svg{width:15px;height:15px}
.v.seed{border-style:dashed} .v.tree{background:var(--green);color:var(--cream)} .v.tree small,.v.tree .due{color:var(--on-color)} .v.sprout{background:var(--ochre);color:#141414} .v.sprout small,.v.sprout .due{color:#5A4A14}
.v .due{font-size:11px;color:var(--muted);font-weight:700}
.tip{border:var(--bw) solid var(--line);border-left-width:12px;border-left-color:var(--red);padding:10px 14px;background:var(--card)}
.tip b{display:block;font-family:var(--display);font-weight:400;font-size:18px;margin-bottom:2px} .tip p{font-size:14px;font-weight:500}
.dlg{display:flex;flex-direction:column;gap:10px;position:relative;isolation:isolate}
.scene{display:flex;align-items:center;gap:10px;margin:-4px 0 4px;font-weight:800;color:var(--muted);font-size:14px}
.scene span{font-size:30px;line-height:1}
.dlg .line{max-width:88%;padding:10px 12px;border:var(--bw) solid var(--line);background:var(--card);display:flex;gap:10px;align-items:center}
.dlg .line.b{align-self:flex-end;background:var(--ochre);color:#141414}
.dlg .line.b .es{color:#5A4A14}
.dlg .eu{font-family:var(--display);font-weight:400;font-size:18px;line-height:1.05} .dlg .es{font-size:12px;color:var(--muted);font-weight:600}
.gtab{width:100%;border-collapse:collapse;background:var(--card);border:var(--bw) solid var(--line)}
.gtab th,.gtab td{padding:9px 8px;text-align:center;border-top:2px solid var(--line);font-size:14px}
.gtab th{background:#141414;color:#FFF9EC;font-weight:700;border-top:0;font-size:12px;text-transform:uppercase;letter-spacing:.06em}
@media (prefers-color-scheme:dark){ .gtab th{background:#FFF9EC;color:#141414} }
.gtab td.lab{text-align:left;color:var(--muted);font-weight:700}
.gtab td b{font-family:var(--display);font-weight:400;font-size:17px}
.count{display:flex;flex-wrap:wrap;gap:4px;font-size:32px;line-height:1.1;padding:12px;background:var(--card);border:var(--bw) solid var(--line)}
.lb-list{display:flex;flex-direction:column;padding:0}
.lbrow{display:grid;grid-template-columns:24px 34px 1fr auto;gap:10px;align-items:center;padding:10px 12px;border-top:var(--bw) solid var(--line)}
.lbrow:first-child{border-top:0}
.lbrow.me{background:var(--ochre-soft)}
.lbrow .rank{font-family:var(--display);font-size:18px;text-align:center}
.lbrow .av{width:34px;height:34px;display:grid;place-items:center;color:#FFF9EC;font-family:var(--display);font-size:15px}
.lbrow .who{min-width:0;display:flex;flex-direction:column;gap:4px}
.lbrow .wbar{display:block;height:8px;border:2px solid var(--line);overflow:hidden}
.lbrow .wbar i{display:block;height:100%;min-width:2px}
.lbrow .num{font-family:var(--display);font-weight:400;font-size:22px;font-variant-numeric:tabular-nums;white-space:nowrap}
.chart{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;align-items:end;height:140px}
.chart .d{display:flex;flex-direction:column;align-items:center;gap:3px;height:100%;justify-content:end}
.chart .bars{display:flex;gap:3px;align-items:end;flex:1;width:100%;justify-content:center}
.chart .bars i{display:block;width:13px;min-height:2px;border:2px solid var(--line);border-bottom:0}
.chart small{font-size:11px;font-weight:800;color:var(--muted)}
.legend{display:flex;gap:14px;font-size:12px;font-weight:700;color:var(--muted);flex-wrap:wrap}
.legend i{display:inline-block;width:12px;height:12px;border:2px solid var(--line);vertical-align:-2px;margin-right:4px}
.tabwrap{overflow-x:auto;border:var(--bw) solid var(--line);background:var(--card)}
.stab{width:100%;border-collapse:collapse;font-size:14px;min-width:0}
.stab th,.stab td{padding:9px 5px;text-align:center;border-top:2px solid var(--line);font-variant-numeric:tabular-nums;white-space:nowrap}
.stab th{border-top:0;background:#141414;color:#FFF9EC;font-weight:700;font-size:12px;text-transform:uppercase;letter-spacing:.04em}
@media (prefers-color-scheme:dark){ .stab th{background:#FFF9EC;color:#141414} }
.stab td.lab{text-align:left;font-weight:800}
.stab tr.me td{background:var(--ochre-soft)}
.stab td.win{color:var(--green);font-weight:800;text-decoration:underline;text-decoration-thickness:3px;text-underline-offset:3px}
@media (prefers-color-scheme:dark){ .stab td.win{color:#F2C230} }
.dot{display:inline-block;width:10px;height:10px;margin-right:6px;vertical-align:1px;border:2px solid var(--line)}
.ch{background:var(--card);border:var(--bw) solid var(--line);padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.ch .who{display:flex;align-items:center;gap:8px;font-weight:800;font-size:14px}
.ch .who .av{width:28px;height:28px;background:var(--green);color:#FFF9EC;display:grid;place-items:center;font-family:var(--display);font-size:13px}
.ch .vs{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center;text-align:center}
.ch .vs b{font-family:var(--display);font-weight:400;font-size:30px}
.ch .vs .w{color:var(--green)}
.learn{background:var(--card);border:var(--bw) solid var(--line);padding:26px 18px;text-align:center;display:flex;flex-direction:column;gap:8px;align-items:center}
.learn .em{font-size:48px;line-height:1}
.learn .eu{font-family:var(--display);font-size:34px;line-height:1.05;color:var(--red)}
.learn .es{font-size:18px;font-weight:700;color:var(--muted)}
.gcard{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--card);border:var(--bw) solid var(--line);border-left-width:12px;border-left-color:var(--blue);padding:12px 14px;color:var(--ink)}
.gcard .em{font-size:26px;line-height:1;flex:none}
.gcard .t{flex:1;min-width:0} .gcard .t strong{display:block;font-family:var(--display);font-weight:400;font-size:18px;line-height:1.05;text-transform:uppercase} .gcard .t small{display:block;color:var(--muted);font-size:12px;font-weight:600;margin-top:2px}
.pieces{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.pc{padding:8px 12px;border:var(--bw) solid var(--line);font-family:var(--display);font-size:22px;line-height:1;color:#FFF9EC}
.pc.subj{background:var(--blue)} .pc.obj{background:var(--ochre);color:#141414} .pc.verb{background:var(--red)} .pc.neg{background:#141414} .pc.num{background:var(--green)} .pc.q{background:#6E3A8A}
.pclegend{display:flex;flex-wrap:wrap;gap:10px;font-size:12px;font-weight:700;color:var(--muted)}
.pclegend i{display:inline-block;width:12px;height:12px;vertical-align:-1px;margin-right:4px;border:2px solid var(--line)}
.drill{background:var(--card);border:var(--bw) solid var(--line);padding:14px;display:flex;flex-direction:column;gap:10px}

 <button class="tab" data-tab="gaur"><span class="eu"><svg viewBox="0 0 100 100" aria-hidden="true"><g fill="currentColor"><path d="M50 50 A25 25 0 0 1 50 0 A12.5 12.5 0 0 1 50 25 A12.5 12.5 0 0 0 50 50Z"/><path d="M50 50 A25 25 0 0 1 100 50 A12.5 12.5 0 0 1 75 50 A12.5 12.5 0 0 0 50 50Z"/><path d="M50 50 A25 25 0 0 1 50 100 A12.5 12.5 0 0 1 50 75 A12.5 12.5 0 0 0 50 50Z"/><path d="M50 50 A25 25 0 0 1 0 50 A12.5 12.5 0 0 1 25 50 A12.5 12.5 0 0 0 50 50Z"/></g></svg>Gaur</span><span class="es">Hoy</span></button>

<script src="lessons.js"></script>
<script>
const app=document.getElementById("app"), tabs=document.getElementById("tabs");
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const norm=s=>String(s).toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/\(.*?\)/g,"").replace(/[¿?¡!.,]/g,"").replace(/\s+/g," ").trim();
const words=s=>s.replace(/[¿?¡!.,]/g,"").split(/\s+/).filter(Boolean);
const lev=(a,b)=>{const m=a.length,n=b.length;if(!m)return n;if(!n)return m;const d=Array.from({length:m+1},(_,i)=>[i,...Array(n).fill(0)]);for(let j=1;j<=n;j++)d[0][j]=j;for(let i=1;i<=m;i++)for(let j=1;j<=n;j++)d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));return d[m][n];};
function toast(m){const t=document.createElement("div");t.className="toast";t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),2200);}
const LAUBURU=`<svg viewBox="0 0 100 100"><g fill="currentColor"><path d="M50 50 A25 25 0 0 1 50 0 A12.5 12.5 0 0 1 50 25 A12.5 12.5 0 0 0 50 50Z"/><path d="M50 50 A25 25 0 0 1 100 50 A12.5 12.5 0 0 1 75 50 A12.5 12.5 0 0 0 50 50Z"/><path d="M50 50 A25 25 0 0 1 50 100 A12.5 12.5 0 0 1 50 75 A12.5 12.5 0 0 0 50 50Z"/><path d="M50 50 A25 25 0 0 1 0 50 A12.5 12.5 0 0 1 25 50 A12.5 12.5 0 0 0 50 50Z"/></g></svg>`;
const HILLS=`<svg class="hills" viewBox="0 0 560 70" preserveAspectRatio="none" aria-hidden="true"><path d="M0 0 H560 V70 H0 Z" fill="var(--red)"/><path d="M0 70 L0 40 L90 18 L170 44 L260 10 L350 38 L430 22 L560 48 L560 70 Z" fill="var(--green-deep)"/><path d="M0 70 L0 56 L120 34 L230 60 L330 42 L450 62 L560 44 L560 70 Z" fill="var(--green)"/></svg>`;
const SPK=`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/></svg>`;
function OLEN(mood="happy",size=96){
  const mouth=mood==="sad"?`<path d="M232 252 Q256 238 280 252" stroke="#141414" stroke-width="7" fill="none" stroke-linecap="round"/>`:`<path d="M226 243 Q256 262 286 243 Q275 258 256 258 Q237 258 226 243 Z" fill="#141414"/>`;
  const brows=mood==="sad"?`<path d="M212 184 Q228 192 244 190" stroke="#141414" stroke-width="5" fill="none" stroke-linecap="round"/><path d="M268 190 Q284 192 300 184" stroke="#141414" stroke-width="5" fill="none" stroke-linecap="round"/>`:`<path d="M212 190 Q228 182 244 190" stroke="#141414" stroke-width="5" fill="none" stroke-linecap="round"/><path d="M268 190 Q284 182 300 190" stroke="#141414" stroke-width="5" fill="none" stroke-linecap="round"/>`;
  const eyes=mood==="happy"?`<path d="M218 210 Q228 200 238 210" stroke="#141414" stroke-width="6" fill="none" stroke-linecap="round"/><path d="M274 210 Q284 200 294 210" stroke="#141414" stroke-width="6" fill="none" stroke-linecap="round"/>`:`<circle cx="228" cy="208" r="7" fill="#141414"/><circle cx="284" cy="208" r="7" fill="#141414"/>`;
  const arm=mood==="wave"?`<path d="M340 330 Q400 300 420 230" stroke="#141414" stroke-width="34" fill="none" stroke-linecap="round"/><circle cx="424" cy="222" r="22" fill="#F2C230"/>`:"";
  return `<svg viewBox="120 80 300 440" width="${size}" height="${size*440/300}" aria-label="Olentzero" style="display:block;overflow:visible"><path d="M150 520 L150 360 Q150 300 256 300 Q362 300 362 360 L362 520 Z" fill="#141414"/>${arm}<path d="M232 300 L256 520 L280 300 Z" fill="#FFF9EC" opacity=".9"/><circle cx="256" cy="360" r="7" fill="#FFF9EC"/><circle cx="256" cy="410" r="7" fill="#FFF9EC"/><circle cx="256" cy="215" r="80" fill="#F2C230"/><path d="M186 225 Q190 320 256 330 Q322 320 326 225 Q300 265 256 262 Q212 265 186 225 Z" fill="#FFF9EC"/>${mouth}${eyes}${brows}<path d="M160 170 Q170 100 256 95 Q342 100 352 170 Q256 150 160 170 Z" fill="#141414"/><ellipse cx="256" cy="168" rx="100" ry="18" fill="#141414"/><circle cx="258" cy="96" r="7" fill="#141414"/></svg>`;
}
const GOOD=[["Oso ondo!","¡Muy bien!"],["Ederki!","¡Estupendo!"],["Primeran!","¡De primera!"],["Bikain!","¡Excelente!"],["Txapeldun!","¡Campeón/a!"],["Zoragarria!","¡Maravilloso!"],["Hori da!","¡Eso es!"],["Aupa!","¡Aúpa!"],["Oso ondo egin duzu!","¡Lo has hecho muy bien!"],["Ikaragarria!","¡Tremendo!"]];
const HARD=[["Ondo, laguntzarekin","Bien, con ayuda"],["Lortu duzu!","¡Lo has conseguido!"],["Hurrengoan laguntzarik gabe","La próxima, sin ayuda"]];
const BAD=[["Ia-ia!","¡Casi!"],["Lasai, hurrengoan!","Tranqui, a la próxima"],["Ez da ezer!","¡No pasa nada!"],["Saiatu berriro!","¡Inténtalo otra vez!"],["Kasik!","¡Por poco!"],["Segi aurrera!","¡Sigue adelante!"]];
const pick=a=>a[Math.floor(Math.random()*a.length)];
function qty(n,em){n=+n;if(!Number.isInteger(n)||n<1||n>99)return "";return "🔟".repeat(Math.floor(n/10))+em.repeat(n%10);}
const U=["","bat","bi","hiru","lau","bost","sei","zazpi","zortzi","bederatzi","hamar","hamaika","hamabi","hamahiru","hamalau","hamabost","hamasei","hamazazpi","hemezortzi","hemeretzi"];
function numEu(n){ if(n<20) return U[n]; const t=Math.floor(n/20), r=n%20; const base=["","hogei","berrogei","hirurogei","laurogei"][t]; return r? base+"ta "+U[r] : base; }
const todayStr=()=>P&&P.today||new Date().toISOString().slice(0,10);

// ---------- voz (mp3 generados en el servidor) ----------
let VOICE=false, AUDIO=null;
async function checkVoice(){ try{ const r=await fetch("/api/tts/status"); const d=await r.json(); VOICE=!!d.ok; }catch(e){ VOICE=false; } }
let SLOW=false; try{ SLOW=localStorage.getItem("euskara.slow")==="1"; }catch(e){}
function speak(text, onEnd, slow){ if(!VOICE) return false; try{ if(AUDIO){ AUDIO.pause(); AUDIO.onended=null; } AUDIO=new Audio("/api/tts?text="+encodeURIComponent(text)); const rate=(slow===undefined?SLOW:slow)?0.7:1; AUDIO.preservesPitch=true; AUDIO.mozPreservesPitch=true; AUDIO.webkitPreservesPitch=true; AUDIO.playbackRate=rate; if(onEnd) AUDIO.onended=onEnd; AUDIO.onerror=()=>{ VOICE=false; toast("Audio no disponible"); }; AUDIO.play().then(()=>{ AUDIO.playbackRate=rate; }).catch(()=>{}); return true; }catch(e){ return false; } }
function speakSeq(list,slow){ let k=0; const go=()=>{ if(k<list.length) speak(list[k++],()=>setTimeout(go,450),slow); }; go(); }
function preload(texts){ if(!VOICE) return; for(const t of texts.slice(0,12)) fetch("/api/tts?text="+encodeURIComponent(t)).catch(()=>{}); }
const spkBtn=(t,cls="")=>VOICE?`<button class="speak ${cls}" data-say="${esc(t)}" aria-label="Escuchar">${SPK}</button>`:"";
// toque: velocidad normal (o la del ajuste) · mantener pulsado: lento 🐢
function wireSpeak(root=app){ root.querySelectorAll("[data-say]").forEach(b=>{ let timer=null, held=false;
  const down=()=>{ held=false; timer=setTimeout(()=>{ held=true; speak(b.dataset.say,null,true); toast("🐢 Poliki · despacio"); },450); };
  const up=ev=>{ clearTimeout(timer); if(!held){ ev.preventDefault(); speak(b.dataset.say); } };
  b.onpointerdown=down; b.onpointerup=up; b.onpointerleave=()=>clearTimeout(timer); b.oncontextmenu=ev=>ev.preventDefault(); b.onclick=ev=>ev.stopPropagation(); }); }

// ---------- API y estado ----------
async function api(path,body){ const r=await fetch("/api/"+path, body?{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)}:{}); const d=await r.json().catch(()=>({error:"Error de red."})); if(!r.ok) throw Object.assign(new Error(d.error||"Error"),d); return d; }
let P=null, ITEMS=[], TAB="gaur";
const imap=()=>Object.fromEntries(ITEMS.map(i=>[i.key,i]));
async function loadItems(){ ITEMS=await api("items"); }

// Catálogo de ítems: lecciones + personales
function personalItems(){
  const pr=P.profile||{}; const out=[]; const Name=P.name[0].toUpperCase()+P.name.slice(1);
  out.push({key:"me:naiz",eu:`Ni ${Name} naiz`,es:`Yo soy ${Name}`,lesson_id:"me",emoji:"🙋"});
  out.push({key:"me:izena",eu:`Nire izena ${Name} da`,es:`Mi nombre es ${Name}`,lesson_id:"me",emoji:"✍️"});
  if(pr.age){ out.push({key:"me:adina",eu:`${numEu(pr.age)} urte ditut`,es:`Tengo ${pr.age} años`,lesson_id:"me",emoji:"🎂"}); }
  if(pr.gender){
    const bro=pr.gender==="neska"?"neba":"anaia", sis=pr.gender==="neska"?"ahizpa":"arreba", mix=pr.gender==="neska"?"neba-arrebak":"anai-arrebak";
    const parts=[]; if(pr.nebak) parts.push(`${bro} ${numEu(pr.nebak)}`); if(pr.ahizpak) parts.push(`${sis} ${numEu(pr.ahizpak)}`);
    const n=(pr.nebak||0)+(pr.ahizpak||0);
    if(n===0) out.push({key:"me:anai",eu:"Ez dut anai-arrebarik",es:"No tengo hermanos",lesson_id:"me",emoji:"🚫"});
    else out.push({key:"me:anai",eu:`${parts.join(" eta ")} ${n===1?"dut":"ditut"}`,es:`Tengo ${[pr.nebak?`${pr.nebak} hermano${pr.nebak>1?"s":""}`:"",pr.ahizpak?`${pr.ahizpak} hermana${pr.ahizpak>1?"s":""}`:""].filter(Boolean).join(" y ")}`,lesson_id:"me",emoji:"👨‍👩‍👧‍👦"});
    out.push({key:"me:genero",eu:pr.gender==="neska"?"Ni neska naiz":"Ni mutila naiz",es:pr.gender==="neska"?"Yo soy chica":"Yo soy chico",lesson_id:"me",emoji:pr.gender==="neska"?"👧":"👦"});
    out.push({key:"me:mix",eu:mix,es:"hermanos (como lo digo yo)",lesson_id:"me",emoji:"👫"});
  }
  return out;
}
function lessonItems(l){
  const out=[];
  for(const [eu,es,em] of l.pairs) out.push({key:`${l.id}:${norm(eu)}`,eu,es,lesson_id:l.id,emoji:em,count:l.countable&&/^\d+$/.test(es)?+es:null,countEm:l.countable});
  for(const [eu,es] of l.sentences) if(!out.some(o=>norm(o.eu)===norm(eu))) out.push({key:`${l.id}:${norm(eu)}`,eu,es,lesson_id:l.id,chunk:true});
  return out;
}
const catalog=()=>[...LESSONS.flatMap(lessonItems),...personalItems()];
function lessonOf(id){ return LESSONS.find(l=>l.id===id); }

function header(sub,mood="wave"){
  return `<header class="head pad"><div class="lb">${LAUBURU}</div><div class="mascot">${OLEN(mood,84)}</div>
    <div class="row"><button class="avatar" id="avbtn" aria-label="Perfil">${esc(P.name[0].toUpperCase())}</button><div style="min-width:0;flex:1"><h1>Kaixo, ${esc(P.name)}</h1><p style="font-size:12px;font-weight:600;color:var(--on-color)">Hola, ${esc(P.name[0].toUpperCase()+P.name.slice(1))}</p></div>
    <span class="pill" title="Firmes"><span style="display:inline-flex;width:14px;height:14px">${LAUBURU}</span>${P.items.consolidated}</span><span class="pill">${P.xp} XP</span></div>
    ${sub?`<p class="sub">${sub}</p>`:""}</header>`;
}
function setTab(t){ document.onkeydown=null; TAB=t; tabs.hidden=false; document.body.classList.remove("notabs"); tabs.querySelectorAll(".tab").forEach(b=>b.classList.toggle("on",b.dataset.tab===t)); const bd=document.getElementById("tbadge"); bd.hidden=!(P&&P.pendingChallenges); bd.textContent=P?P.pendingChallenges:""; ({gaur:renderToday,ikasgaiak:renderLessons,taldea:renderTeam,datuak:renderStats})[t](); const av=document.getElementById("avbtn"); if(av) av.onclick=()=>renderProfile(); window.scrollTo(0,0); }
tabs.querySelectorAll(".tab").forEach(b=>b.onclick=()=>setTab(b.dataset.tab));
function noTabs(){ tabs.hidden=true; document.body.classList.add("notabs"); }

// ---------- LOGIN ----------
function renderLogin(mode="login",prefill={}){
  noTabs(); const reg=mode==="register";
  app.innerHTML=`<div class="head pad" style="padding-bottom:26px"><div class="lb">${LAUBURU}</div><div class="row" style="gap:18px;position:relative"><div class="olen">${OLEN("wave",80)}</div><div><p class="eyebrow" data-es="Práctica de euskera">Euskara praktika</p><h1>${reg?"Sortu kontua":"Nor zara?"}</h1><p style="color:var(--on-color);font-weight:600;font-size:13px">${reg?"Crea tu cuenta":"¿Quién eres?"}</p></div></div></div>
   <div class="stack pad" style="padding-top:22px"><p class="muted">${reg?"Elige un nombre, un PIN de 4 cifras y el código de invitación.":"Entra con tu nombre y tu PIN."}</p>
    <form id="f" class="stack"><input class="ans" id="name" placeholder="Nombre" autocomplete="username" autocapitalize="none" value="${esc(prefill.name||"")}"><input class="ans" id="pin" placeholder="PIN" inputmode="numeric" pattern="[0-9]*" type="password" autocomplete="${reg?"new-password":"current-password"}" value="${esc(prefill.pin||"")}">${reg?`<input class="ans" id="invite" placeholder="Código de invitación" autocomplete="off" autocapitalize="none">`:""}<p class="err" id="err"></p><button class="btn red" type="submit">${reg?"Crear cuenta":"Sartu<small>Entrar"}</small></button></form>
    <button class="link" id="swap">${reg?"Ya tengo cuenta":"Crear una cuenta nueva"}</button></div>`;
  document.getElementById("swap").onclick=()=>renderLogin(reg?"login":"register");
  document.getElementById("f").onsubmit=async e=>{ e.preventDefault(); const name=document.getElementById("name").value,pin=document.getElementById("pin").value,invite=(document.getElementById("invite")||{}).value||""; const err=document.getElementById("err"); err.textContent="";
    try{ P=await api(reg?"register":"login",{name,pin,invite}); await Promise.all([loadItems(),checkVoice()]); if(!P.profile.gender) renderProfile(true); else setTab("gaur"); }
    catch(ex){ if(ex.unknown){ renderLogin("register",{name,pin}); document.getElementById("err").textContent="No existe ese usuario. ¿Quieres crearlo?"; } else err.textContent=ex.message; } };
}

// ---------- PERFIL (personalización) ----------
function renderProfile(first=false){
  noTabs(); const pr=P.profile||{};
  app.innerHTML=`<div class="top pad"><button id="back" aria-label="Volver" style="font-size:22px;color:var(--muted)">${first?"":"‹"}</button><div style="flex:1"><p class="eyebrow" data-es="Mi perfil">Nire profila</p><h2>Zu zeu · sobre ti</h2></div></div>
   <div class="stack pad" style="flex:1">
    <p class="muted">Con esto la app crea frases sobre ti (tu edad, tus hermanos…). Lo que dices de ti mismo se recuerda mucho mejor que lo de Ane y Mikel.</p>
    <p class="eyebrow" data-es="¿Chica o chico?">Neska ala mutila?</p>
    <div class="opts" style="grid-template-columns:1fr 1fr"><button class="opt" data-g="neska" aria-pressed="${pr.gender==="neska"}">👧 Neska<br><small class="muted">chica · neba / ahizpa</small></button><button class="opt" data-g="mutila" aria-pressed="${pr.gender==="mutila"}">👦 Mutila<br><small class="muted">chico · anaia / arreba</small></button></div>

// Etapa de una frase: 🌱 nueva (no introducida) · 🌿 en estudio · 🌳 firme (intervalo ≥ 7 días)
function stage(it){ if(!it) return {k:"seed",em:"🌱",t:"nueva"}; if(it.interval>=7) return {k:"tree",em:`<span style="display:inline-flex;width:1em;height:1em;vertical-align:-2px">${LAUBURU}</span>`,t:"firme"}; return {k:"sprout",em:"🌿",t:"en estudio"}; }
function daysUntil(due){ const a=new Date(todayStr()+"T12:00:00"), b=new Date(due+"T12:00:00"); return Math.round((b-a)/86400000); }
function dueLabel(it){ const d=daysUntil(it.due); return d<=0?"vence hoy":d===1?"vuelve mañana":`vuelve en ${d} días`; }
function stageBar(items,m){ const c={seed:0,sprout:0,tree:0}; for(const it of items) c[stage(m[it.key]).k]++; const n=items.length||1; return `<div class="sbar" title="${c.tree} firmes · ${c.sprout} en estudio · ${c.seed} por ver"><i class="t" style="width:${c.tree/n*100}%"></i><i class="s" style="width:${c.sprout/n*100}%"></i></div><small class="slegend"><span style="display:inline-flex;width:11px;height:11px;vertical-align:-1px">${LAUBURU}</span> ${c.tree} · 🌿 ${c.sprout} · 🌱 ${c.seed}</small>`; }

function dueToday(){ const t=todayStr(); return ITEMS.filter(i=>i.due<=t).sort((a,b)=>a.due<b.due?-1:a.due>b.due?1:b.lapses-a.lapses); }
function nextNew(n){
  const known=new Set(ITEMS.map(i=>i.key)); const out=[];
  for(const l of LESSONS){ for(const it of lessonItems(l)) if(!known.has(it.key)){ out.push(it); if(out.length>=n) return out; } if(out.length) return out; }
  return out;
}

let SES=null;

function saveSes(){ try{ if(SES) localStorage.setItem(sesKey(),JSON.stringify(SES)); }catch(e){} }
function loadSes(){ try{ const d=JSON.parse(localStorage.getItem(sesKey())||"null"); return d&&d.ex&&d.i<d.ex.length?d:null; }catch(e){ return null; } }

const TR=(()=>{ const o={}; for(const [k,v] of Object.entries(window.TRANSFORMS||{})) o[norm(k)]=v; return o; })();

  const ex={key:it.key,eu:it.eu,es:it.es,lesson_id:it.lesson_id,emoji:it.emoji||"",opts:opts(),mode:"produce"};

}
function startSession(opts){

    if(opts.forceTransform&&it.tr){ ex.push({key:it.key,eu:it.eu,es:it.es,lesson_id:it.lesson_id,emoji:it.emoji||"",mode:"transform",from:it.eu,instr:it.tr.i,to:it.tr.to,toEs:it.tr.es||"",opts:shuffle([it.tr.to,...shuffle([...new Set(pool.map(p=>p.eu).filter(x=>norm(x)!==norm(it.tr.to)&&norm(x)!==norm(it.eu)))]).slice(0,3)])}); }

  const st=document.getElementById("sendTask"); if(st) st.onclick=async()=>{ const to=document.getElementById("taskTo").value, t=tasks[+document.getElementById("taskSel").value], ans=document.getElementById("taskAns").value.trim(); if(!ans) return toast("Escribe la respuesta primero"); try{ await api("challenges",{to,kind:"task",payload:{text:t.t.replace("{X}",to),check:t.check},fromResult:{answer:ans}}); toast("Bidalita · enviado"); renderTeam(); }catch(e){ toast(e.message); } };
  app.querySelectorAll("[data-play]").forEach(b=>b.onclick=()=>{ const c=chs.find(x=>x.id===+b.dataset.play); startSession({items:c.payload.items,label:(c.payload.transform?"Eraldatu de ":"Erronka de ")+c.from,challenge:{id:c.id},forceTransform:!!c.payload.transform}); });
  app.querySelectorAll("[data-ok]").forEach(b=>b.onclick=async()=>{ const id=+b.dataset.ok, fix=(app.querySelector(`[data-fix="${id}"]`)||{}).value||""; try{ await api(`challenges/${id}/result`,{result:{ok:b.dataset.v==="1",fix}}); renderTeam(); }catch(e){ toast(e.message); } });
}
function renderChallenge(c){
  const who=`<div class="who"><span class="av">${esc(c.from[0].toUpperCase())}</span>${esc(c.from)}${c.mine?" (tú)":""} <span class="muted">→</span> <span class="av">${esc(c.to[0].toUpperCase())}</span>${esc(c.to)}${c.forMe?" (tú)":""}</div>`;
  if(c.kind==="duel"){
    const a=c.fromResult, b=c.toResult;
    if(a&&b) return `<div class="ch">${who}<div class="vs"><b class="${a.score>b.score?"w":""}">${a.score}/${a.total}</b><span class="muted">vs</span><b class="${b.score>a.score?"w":""}">${b.score}/${b.total}</b></div><p class="hint" style="text-align:center">${a.score===b.score?"Berdinketa · empate":(a.score>b.score?c.from:c.to)+" irabazle · gana"}</p></div>`;
    if(c.forMe&&!b) return `<div class="ch">${who}<p>${esc(c.from)} te reta: ${c.payload.transform?"6 transformaciones":"6 frases escribiendo"}. ${a?`Ya ha hecho ${a.score}/${a.total}.`:""}</p><button class="btn red sm" data-play="${c.id}">Onartu<small>Jugar</small></button></div>`;
    return `<div class="ch">${who}<p class="hint">Tu resultado: ${a?a.score+"/"+a.total:"–"}. Esperando a ${esc(c.to)}.</p></div>`;
  }
  const r=c.toResult, mine=c.fromResult||{};
  return `<div class="ch">${who}<p style="font-size:15px">${esc(c.payload.text)}</p><p><b style="color:var(--red)">${esc(mine.answer||"")}</b></p>
    ${r?`<p class="hint">${r.ok?"✅ Confirmado por "+esc(c.to):"✏️ Corrección de "+esc(c.to)+": <b>"+esc(r.fix||"")+"</b>"}</p>`:c.forMe?`<p class="hint">¿Es lo que dijiste? Si no, escribe la forma correcta.</p><input class="ans" data-fix="${c.id}" placeholder="Corrección (opcional)"><div class="row"><button class="btn sm" data-ok="${c.id}" data-v="1">Zuzena ✓<small>Correcto</small></button><button class="btn ghost sm" data-ok="${c.id}" data-v="0">Zuzendu<small>Corregir</small></button></div>`:`<p class="hint">Esperando confirmación de ${esc(c.to)}.</p>`}</div>`;
}
async function finishChallenge(score,total){
  const c=SES.challenge; const answers=SES.answers;
  try{
    if(c.id) await api(`challenges/${c.id}/result`,{result:{score,total}});
    else await api("challenges",{to:c.to,kind:"duel",payload:{items:c.items,transform:!!c.transform},fromResult:{score,total}});
    P=await api("round",{lessonId:null,ok:score,total:Math.max(total,1)});
  }catch(e){ toast(e.message); }
  app.innerHTML=`<div class="head pad" style="padding-bottom:28px;text-align:center"><div class="lb">${LAUBURU}</div><p class="eyebrow" data-es="Reto terminado">Erronka amaituta</p><h1 style="margin-top:6px">${score}/${total}</h1><p class="sub" style="max-width:none">${c.id?"Resultado enviado. Mira el marcador en Taldea.":"Reto enviado. Cuando conteste, veréis el marcador en Taldea."}</p></div><div class="stack pad" style="padding-top:18px"><button class="btn" id="home">Taldera<small>ir a Taldea</small></button></div>`;
  document.getElementById("home").onclick=()=>setTab("taldea");
}

// ---------- DATUAK ----------
async function renderStats(){
  app.innerHTML=header("Datuak · lo que de verdad se queda")+`<div class="stack pad" style="padding-top:18px"><p class="muted">Kargatzen…</p></div>`;
  let data; try{ data=await api("stats"); }catch(e){ app.querySelector(".stack").innerHTML=`<p class="err">No se pudieron cargar los datos.</p>`; return; }
  const COLORS=["#B8281F","#2A7A4F","#D9A441","#3B6EA5","#8E4A9E","#C8683A"];
  const users=data.users.slice().sort((a,b)=>b.consolidated-a.consolidated||b.weekXp-a.weekXp).map((u,i)=>({...u,color:COLORS[i%COLORS.length]}));
  const active=users.filter(u=>u.weekXp>0||u.me); const me=users.find(u=>u.me);
  const dayLabel=d=>["Ig","Al","Ar","Az","Og","Ol","Lr"][new Date(d+"T12:00:00").getDay()];
  const maxC=Math.max(1,...users.map(u=>u.learned)); const mx=Math.max(1,...users.flatMap(u=>u.perDay));
  const best=k=>Math.max(...users.map(u=>u[k])); const cell=(u,k,f=x=>x)=>`<td class="${u[k]===best(k)&&u[k]>0?"win":""}">${f(u[k])}</td>`;
  const m=imap(); const soon=ITEMS.filter(i=>i.due>data.days[6]).length;
  app.querySelector(".stack").classList.add("cols");
  app.querySelector(".stack").innerHTML=`<div class="col">
    <div class="stats"><div class="stat g"><b style="display:flex;justify-content:center;align-items:center;gap:6px"><span style="display:inline-flex;width:22px;height:22px">${LAUBURU}</span>${me.consolidated}</b><span>Sendoak · firmes</span></div><div class="stat"><b>${me.learned}</b><span>Ikasten · en estudio</span></div><div class="stat"><b>🔥 ${me.streak}</b><span>Egunak · seguidos</span></div><div class="stat"><b>${me.accuracy}%</b><span>Lehenengoan · a la primera</span></div></div>
    <p class="hint">Firme = la has acertado tantas veces que no vuelve hasta dentro de una semana o más. ${soon?`${soon} frases programadas para más adelante.`:""}</p>
    <p class="eyebrow" data-es="firmes por persona">Taldea</p>
    <div class="card lb-list">${users.map((u,i)=>`<div class="lbrow ${u.me?"me":""}"><span class="rank">${["🥇","🥈","🥉"][i]||(i+1)}</span><span class="av" style="background:${u.color}">${esc(u.name[0].toUpperCase())}</span><span class="who"><b>${esc(u.name)}${u.me?" (tú)":""}</b>${u.practicedToday?" <span class='muted' style='font-size:13px'>· gaur 🔥</span>":""}<i class="wbar"><i style="width:${Math.round(u.learned/maxC*100)}%;background:${u.color};opacity:.4"></i></i><i class="wbar" style="margin-top:-6px;background:transparent"><i style="width:${Math.round(u.consolidated/maxC*100)}%;background:${u.color}"></i></i></span><b class="num">${u.consolidated}<span class="muted" style="font-size:13px;font-family:var(--body)"> / ${u.learned}</span></b></div>`).join("")}</div>
    <p class="hint">Barra clara: frases en estudio. Barra oscura: firmes.</p>
    </div><div class="col">
    <p class="eyebrow" data-es="XP por día">Azken 7 egunak</p>
    <div class="card"><div class="chart">${data.days.map((d,i)=>`<div class="d"><div class="bars">${active.map(u=>`<i style="height:${Math.round(u.perDay[i]/mx*100)}%;background:${u.color}" title="${esc(u.name)}: ${u.perDay[i]} XP"></i>`).join("")}</div><small>${dayLabel(d)}</small></div>`).join("")}</div><div class="legend" style="margin-top:10px">${active.map(u=>`<span><i style="background:${u.color}"></i>${esc(u.name)}</span>`).join("")}</div></div>
    <p class="eyebrow" data-es="todos">Denak</p>
    <div class="tabwrap"><table class="stab"><tr><th></th><th title="Firmes">Sendo</th><th title="En estudio">Ikast</th><th title="XP semana">Astea</th><th title="XP total">Guzt</th><th>🔥</th><th>%</th></tr>${users.map(u=>`<tr class="${u.me?"me":""}"><td class="lab"><span class="dot" style="background:${u.color}"></span>${esc(u.name)}</td>${cell(u,"consolidated")}${cell(u,"learned")}${cell(u,"weekXp")}${cell(u,"xp")}${cell(u,"streak")}${cell(u,"accuracy",x=>x+"%")}</tr>`).join("")}</table></div>
    <p class="hint">Sendo = firmes · Ikast = en estudio · Astea = XP de la semana · Guzt = XP total · 🔥 = racha · % = aciertos a la primera.</p></div>`;
}
