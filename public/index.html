<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Euskara Praktika</title>
<meta name="theme-color" content="#B8281F">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Euskara">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="olentzero.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&family=Nunito+Sans:wght@400;600;700;800&display=swap">
<style>
:root{
  --bg:#F7F1E3; --card:#FFFDF8; --ink:#26211B; --muted:#6E655A; --line:#E3D9C6;
  --red:#B8281F; --red-deep:#8F1D16; --red-soft:#F6DDD8; --green:#2A7A4F; --green-deep:#1E5A3A; --green-soft:#D9EBDD;
  --ochre:#D9A441; --ochre-soft:#F6E7C4; --cream:#F7F1E3; --blue:#3B6EA5; --blue-soft:#DCE7F3;
  --display:'Alfa Slab One',Georgia,serif; --body:'Nunito Sans',system-ui,-apple-system,sans-serif; --r:18px; color-scheme:light;
}
@media (prefers-color-scheme:dark){ :root{ --bg:#1B1A17; --card:#26241F; --ink:#F3EEE3; --muted:#B3AA9B; --line:#3B372F; --red:#E05545; --red-deep:#B8281F; --red-soft:#4A2320; --green:#5FBF8C; --green-deep:#2A7A4F; --green-soft:#1F3A2C; --ochre:#E9B85A; --ochre-soft:#4A3A1A; --cream:#F7F1E3; --blue:#7FA8DA; --blue-soft:#1F2E42; color-scheme:dark } }
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.4;-webkit-font-smoothing:antialiased}
.app{max-width:560px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
body.notabs .app{padding-bottom:0}
.pad{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--display);font-weight:400;margin:0;text-wrap:balance;line-height:1.1;letter-spacing:.01em}
h1{font-size:34px} h2{font-size:24px} h3{font-size:18px}
p{margin:0}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--ochre);outline-offset:2px}
.btn{display:block;width:100%;padding:16px;border-radius:14px;font-weight:800;font-size:18px;text-align:center;background:var(--green);color:#fff;box-shadow:0 4px 0 var(--green-deep)}
.btn:active{transform:translateY(2px);box-shadow:0 2px 0 var(--green-deep)}
.btn.red{background:var(--red);box-shadow:0 4px 0 var(--red-deep)}
.btn.ghost{background:transparent;color:var(--green);border:2px solid var(--green);box-shadow:none}
.btn.sm{padding:10px 14px;font-size:15px;width:auto;display:inline-block;box-shadow:0 3px 0 var(--green-deep)}
.btn.ghost.sm{box-shadow:none}
.btn:disabled{opacity:.4;box-shadow:none}
.eyebrow{font-size:12px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;align-items:center;gap:12px}
.spacer{flex:1}
.err{color:var(--red);font-weight:700;min-height:1.4em}
.hint{font-size:14px;color:var(--muted)}
.head{position:relative;overflow:hidden;background:var(--red);color:var(--cream);padding-top:calc(14px + env(safe-area-inset-top,0px));padding-bottom:18px}
.head .mascot{position:absolute;right:max(14px,env(safe-area-inset-right,0px));bottom:-26px;z-index:2;filter:drop-shadow(0 4px 0 rgba(0,0,0,.25))}
.head .lb{position:absolute;right:-40px;top:-30px;width:190px;height:190px;color:#fff;opacity:.12}
.head .lb svg{width:100%;height:100%}
.head .eyebrow{color:#F6C9C2}
.head .pill{background:rgba(255,255,255,.18);color:var(--cream)}
.pill{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;font-weight:800;font-size:14px;background:var(--ochre-soft);color:var(--ink);white-space:nowrap;font-variant-numeric:tabular-nums}
.pill.g{background:var(--green-soft)} .pill.b{background:var(--blue-soft)}
.avatar{width:44px;height:44px;border-radius:50%;background:var(--cream);color:var(--red);display:grid;place-items:center;font-family:var(--display);font-size:20px;flex:none}
.hills{display:block;width:100%;height:auto;margin-top:-1px}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:15;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
.tab{position:relative;display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 0 8px;font-weight:800;font-size:12px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);border-top:3px solid transparent}
.tab.on{color:var(--red);border-top-color:var(--red)}
.tab svg{width:26px;height:26px}
.tab .badge{position:absolute;top:6px;right:18%;background:var(--red);color:#fff;font-size:11px;border-radius:999px;padding:1px 6px}
.lesson{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-left:6px solid var(--green);border-radius:var(--r);padding:16px}
.lesson.done{border-left-color:var(--ochre)}
.lesson .n{width:48px;height:48px;border-radius:50%;flex:none;display:grid;place-items:center;font-family:var(--display);font-size:20px;color:var(--green);background:conic-gradient(var(--green) var(--p,0%),var(--line) 0)}
.lesson .n b{width:38px;height:38px;border-radius:50%;background:var(--card);display:grid;place-items:center;font-weight:400}
.lesson .t{flex:1;min-width:0}
.lesson .t strong{display:block;font-size:18px}
.lesson .t small{display:block;color:var(--muted);font-size:14px}
.top{display:flex;align-items:center;gap:12px;padding-top:calc(10px + env(safe-area-inset-top,0px));padding-bottom:14px}
.top .bar{flex:1;height:12px;background:var(--line);border-radius:999px;overflow:hidden}
.top .bar i{display:block;height:100%;width:0;background:var(--green);border-radius:999px;transition:width .3s}
.prompt{font-size:26px;font-weight:800;line-height:1.25}
.prompt.eu{font-family:var(--display);font-weight:400;color:var(--red)}
.opts{display:grid;gap:10px}
.opt{text-align:left;padding:14px 16px;border-radius:14px;border:2px solid var(--line);background:var(--card);font-size:18px;font-weight:600;box-shadow:0 3px 0 var(--line)}
.opt[aria-pressed="true"]{border-color:var(--green);background:var(--green-soft)}
.opt.ok{border-color:var(--green);background:var(--green-soft)} .opt.bad{border-color:var(--red);background:var(--red-soft)}
input.ans,select.ans{width:100%;font:inherit;font-size:20px;padding:14px 16px;border-radius:14px;border:2px solid var(--line);background:var(--card);color:var(--ink)}
input.ans.ok{border-color:var(--green)} input.ans.bad{border-color:var(--red)}
.helps{display:flex;gap:8px;flex-wrap:wrap}
.help{padding:8px 12px;border-radius:999px;border:2px solid var(--line);font-weight:700;font-size:14px;color:var(--muted)}
.help.on{border-color:var(--ochre);background:var(--ochre-soft);color:var(--ink)}
.speak{display:inline-grid;place-items:center;width:44px;height:44px;border-radius:50%;background:var(--blue-soft);color:var(--blue);flex:none}
.speak.big{width:96px;height:96px;font-size:40px;margin:10px auto}
.speak svg{width:22px;height:22px}
.speak.big svg{width:44px;height:44px}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:20;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px calc(18px + env(safe-area-inset-bottom,0px));transform:translateY(110%);transition:transform .25s;border-radius:24px 24px 0 0;max-height:85vh;overflow:auto}
.sheet.show{transform:none}
.sheet .in{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
.sheet.ok{background:var(--green-soft)} .sheet.bad{background:var(--red-soft)} .sheet.info{background:var(--ochre-soft)}
.sheet h3{font-family:var(--body);font-weight:800;font-size:20px}
.sheet.ok h3{color:var(--green)} .sheet.bad h3{color:var(--red)}
.sheet.bad .btn{background:var(--red);box-shadow:0 4px 0 var(--red-deep)}
.sh-olen{flex:none;width:64px;height:94px;overflow:hidden}
.note{border-left:5px solid var(--ochre);background:var(--card);border-radius:0 14px 14px 0;padding:10px 12px;font-size:15px}
.bottom{position:sticky;bottom:0;padding-block:12px calc(12px + env(safe-area-inset-bottom,0px));background:var(--bg);box-shadow:0 -12px 12px -8px var(--bg)}
.big{font-family:var(--display);font-size:60px;line-height:1;color:var(--red);font-variant-numeric:tabular-nums}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;text-align:center}
.stat b{display:block;font-family:var(--display);font-weight:400;font-size:28px;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted);font-weight:800;text-transform:uppercase;letter-spacing:.1em}
.link{color:var(--green);font-weight:700;text-decoration:underline;text-underline-offset:3px}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:8px 14px;border-radius:999px;border:2px solid var(--line);background:var(--card);font-weight:700;font-size:15px}
.chip.on{border-color:var(--red);background:var(--red);color:#fff}
.pattern{background:var(--red);color:var(--cream);border-radius:var(--r);padding:16px 18px}
.pattern .pat{font-family:var(--display);font-size:30px;line-height:1.15;margin-top:6px}
.pattern .blank{color:var(--ochre);border-bottom:4px solid var(--ochre)}
.vocab{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.v{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px 12px;display:flex;flex-direction:column;gap:4px;min-width:0;position:relative;text-align:left}
.v .em{font-size:30px;line-height:1}
.v .em.q{font-size:22px;letter-spacing:-2px;line-height:1.2;overflow-wrap:anywhere}
.v b{font-family:var(--display);font-weight:400;font-size:17px;color:var(--red);line-height:1.2;overflow-wrap:anywhere}
.v small{color:var(--muted);font-size:14px}
.v .st{position:absolute;top:10px;right:10px;width:10px;height:10px;border-radius:50%;background:var(--line)}
.v .st.new{background:var(--ochre)} .v .st.ok{background:var(--green)}
.tip{border-left:5px solid var(--ochre);background:var(--ochre-soft);border-radius:0 var(--r) var(--r) 0;padding:12px 14px}
.tip b{display:block;margin-bottom:4px} .tip p{font-size:15px}
.dlg{display:flex;flex-direction:column;gap:10px;position:relative;overflow:hidden}
.scene{display:flex;align-items:center;gap:10px;margin:-4px 0 6px;font-weight:800;color:var(--muted)}
.scene span{font-size:34px;line-height:1}
.dlg::after{content:"";position:absolute;right:-10px;bottom:-14px;width:120px;height:120px;background:var(--ochre-soft);border-radius:50%;opacity:.6;z-index:0}
.dlg .line{position:relative;z-index:1;max-width:88%;padding:10px 14px;border-radius:16px;background:var(--green-soft);display:flex;gap:10px;align-items:center}
.dlg .line.b{align-self:flex-end;background:var(--red-soft)}
.dlg .eu{font-weight:800} .dlg .es{font-size:14px;color:var(--muted)}
.gtab{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.gtab th,.gtab td{padding:10px 8px;text-align:center;border-top:1px solid var(--line);font-size:15px}
.gtab th{background:var(--green-soft);font-weight:800;border-top:0}
.gtab td.lab{text-align:left;color:var(--muted);font-weight:700}
.gtab td b{font-family:var(--display);font-weight:400;color:var(--red);font-size:17px}
.count{display:flex;flex-wrap:wrap;gap:4px;font-size:34px;line-height:1.1;padding:14px;background:var(--card);border:1px solid var(--line);border-radius:var(--r)}
.lb-list{display:flex;flex-direction:column;gap:10px}
.lbrow{display:grid;grid-template-columns:28px 40px 1fr auto;gap:10px;align-items:center;padding:6px 0}
.lbrow.me .who b{color:var(--red)}
.lbrow .rank{font-size:18px;text-align:center}
.lbrow .av{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:#fff;font-family:var(--display);font-size:18px}
.lbrow .who{min-width:0;display:flex;flex-direction:column;gap:4px}
.lbrow .wbar{display:block;height:8px;background:var(--line);border-radius:999px;overflow:hidden}
.lbrow .wbar i{display:block;height:100%;border-radius:999px;min-width:2px}
.lbrow .num{font-family:var(--display);font-weight:400;font-size:20px;font-variant-numeric:tabular-nums;white-space:nowrap}
.chart{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;align-items:end;height:140px}
.chart .d{display:flex;flex-direction:column;align-items:center;gap:3px;height:100%;justify-content:end}
.chart .bars{display:flex;gap:3px;align-items:end;flex:1;width:100%;justify-content:center}
.chart .bars i{display:block;width:14px;border-radius:4px 4px 0 0;min-height:2px}
.chart small{font-size:11px;font-weight:800;color:var(--muted)}
.legend{display:flex;gap:14px;font-size:13px;font-weight:700;color:var(--muted);flex-wrap:wrap}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-1px;margin-right:4px}
.tabwrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--card)}
.stab{width:100%;border-collapse:collapse;font-size:15px;min-width:460px}
.stab th,.stab td{padding:10px 8px;text-align:center;border-top:1px solid var(--line);font-variant-numeric:tabular-nums;white-space:nowrap}
.stab th{border-top:0;background:var(--green-soft);font-weight:800;font-size:13px}
.stab td.lab{text-align:left;font-weight:800}
.stab tr.me td{background:var(--ochre-soft)}
.stab td.win{color:var(--green);font-weight:800}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:1px}
.ch{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.ch .who{display:flex;align-items:center;gap:8px;font-weight:800}
.ch .who .av{width:30px;height:30px;border-radius:50%;background:var(--green);color:#fff;display:grid;place-items:center;font-family:var(--display);font-size:14px}
.ch .vs{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center;text-align:center}
.ch .vs b{font-family:var(--display);font-weight:400;font-size:26px}
.ch .vs .w{color:var(--green)}
.learn{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:28px 20px;text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center}
.learn .em{font-size:52px;line-height:1}
.learn .eu{font-family:var(--display);font-size:32px;color:var(--red);line-height:1.15}
.learn .es{font-size:22px;font-weight:700}
.sbar{display:flex;height:10px;background:var(--line);border-radius:999px;overflow:hidden;margin-top:8px}
.sbar i{display:block;height:100%} .sbar i.t{background:var(--green)} .sbar i.s{background:var(--ochre)}
.slegend{display:block;font-size:12px;color:var(--muted);font-weight:700;margin-top:4px}
.v .tag{position:absolute;top:8px;right:8px;font-size:14px;line-height:1}
.v.seed{opacity:.8;border-style:dashed} .v.tree{border-color:var(--green);background:var(--green-soft)} .v.sprout{border-color:var(--ochre)}
.v .due{font-size:11px;color:var(--muted);font-weight:700}
.today{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.today .box{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 8px;text-align:center}
.today .box b{display:block;font-family:var(--display);font-weight:400;font-size:26px;font-variant-numeric:tabular-nums}
.today .box span{font-size:11px;color:var(--muted);font-weight:800;text-transform:uppercase;letter-spacing:.08em}
.today .box.hot{border-color:var(--red);background:var(--red-soft)} .today .box.hot b{color:var(--red)}
.today .box.done{border-color:var(--green)} .today .box.done b{color:var(--green)}
.grow{display:flex;gap:10px;align-items:center;font-size:14px;font-weight:700;color:var(--muted);flex-wrap:wrap}
.grow span{display:inline-flex;align-items:center;gap:4px}
.list .it{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.list .it:first-child{border-top:0}
.list .it .em{font-size:20px;width:28px;text-align:center}
.list .it .tx{flex:1;min-width:0} .list .it .tx b{color:var(--red)} .list .it .tx small{display:block;color:var(--muted);font-size:13px}
.olen{flex:none;filter:drop-shadow(0 4px 0 rgba(0,0,0,.25))}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(100px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-weight:700;z-index:30}
@media (prefers-reduced-motion:reduce){ .sheet,.top .bar i{transition:none} }
</style>
</head>
<body>
<div class="app" id="app"></div>
<div class="sheet" id="sheet"><div class="in" id="sh-in"></div></div>
<nav class="tabs" id="tabs" hidden><div class="in">
 <button class="tab" data-tab="gaur"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>Gaur</button>
 <button class="tab" data-tab="ikasgaiak"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 20 L9 9 L13 15 L16 11 L21 20 Z"/><path d="M8 5a1 1 0 1 0 2 0a1 1 0 1 0-2 0"/></svg>Ikasgaiak</button>
 <button class="tab" data-tab="taldea"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.5"/><circle cx="17" cy="9" r="2.5"/><path d="M2.5 19c0-3.5 3-5.5 6.5-5.5s6.5 2 6.5 5.5"/><path d="M15 14.5c3 0 6 1.5 6 4.5"/></svg>Taldea<span class="badge" id="tbadge" hidden></span></button>
 <button class="tab" data-tab="datuak"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V10"/><path d="M10 20V4"/><path d="M16 20v-7"/><path d="M22 20H2"/></svg>Datuak</button>
</div></nav>

<script src="lessons.js"></script>
<script>
const app=document.getElementById("app"), tabs=document.getElementById("tabs");
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const norm=s=>String(s).toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/\(.*?\)/g,"").replace(/[¿?¡!.,]/g,"").replace(/\s+/g," ").trim();
const words=s=>s.replace(/[¿?¡!.,]/g,"").split(/\s+/).filter(Boolean);
const lev=(a,b)=>{const m=a.length,n=b.length;if(!m)return n;if(!n)return m;const d=Array.from({length:m+1},(_,i)=>[i,...Array(n).fill(0)]);for(let j=1;j<=n;j++)d[0][j]=j;for(let i=1;i<=m;i++)for(let j=1;j<=n;j++)d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));return d[m][n];};
function toast(m){const t=document.createElement("div");t.className="toast";t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),2200);}

function speak(text, onEnd, slow){ if(!VOICE) return false; try{ if(AUDIO){ AUDIO.pause(); AUDIO.onended=null; } AUDIO=new Audio("/api/tts?text="+encodeURIComponent(text)); const rate=(slow===undefined?SLOW:slow)?0.7:1; AUDIO.preservesPitch=true; AUDIO.mozPreservesPitch=true; AUDIO.webkitPreservesPitch=true; AUDIO.playbackRate=rate; if(onEnd) AUDIO.onended=onEnd; AUDIO.onerror=()=>{ VOICE=false; toast("Audio no disponible"); }; AUDIO.play().then(()=>{ AUDIO.playbackRate=rate; }).catch(()=>{}); return true; }catch(e){ return false; } }
function speakSeq(list,slow){ let k=0; const go=()=>{ if(k<list.length) speak(list[k++],()=>setTimeout(go,450),slow); }; go(); }

function wireSpeak(root=app){ root.querySelectorAll("[data-say]").forEach(b=>{ let timer=null, held=false;
  const down=()=>{ held=false; timer=setTimeout(()=>{ held=true; speak(b.dataset.say,null,true); toast("🐢 Poliki · despacio"); },450); };
  const up=ev=>{ clearTimeout(timer); if(!held){ ev.preventDefault(); speak(b.dataset.say); } };
  b.onpointerdown=down; b.onpointerup=up; b.onpointerleave=()=>clearTimeout(timer); b.oncontextmenu=ev=>ev.preventDefault(); b.onclick=ev=>ev.stopPropagation(); }); }

function personalItems(){
  const pr=P.profile||{}; const out=[]; const Name=P.name[0].toUpperCase()+P.name.slice(1);

  if(pr.gender){
    const bro=pr.gender==="neska"?"neba":"anaia", sis=pr.gender==="neska"?"ahizpa":"arreba", mix=pr.gender==="neska"?"neba-arrebak":"anai-arrebak";
    const parts=[]; if(pr.nebak) parts.push(`${bro} ${numEu(pr.nebak)}`); if(pr.ahizpak) parts.push(`${sis} ${numEu(pr.ahizpak)}`);

    out.push({key:"me:mix",eu:mix,es:"hermanos (como lo digo yo)",lesson_id:"me",emoji:"👫"});
  }
  return out;
}
function lessonItems(l){
  const out=[];
  for(const [eu,es,em] of l.pairs) out.push({key:`${l.id}:${norm(eu)}`,eu,es,lesson_id:l.id,emoji:em,count:l.countable&&/^\d+$/.test(es)?+es:null,countEm:l.countable});
  for(const [eu,es] of l.sentences) if(!out.some(o=>norm(o.eu)===norm(eu))) out.push({key:`${l.id}:${norm(eu)}`,eu,es,lesson_id:l.id,chunk:true});
  return out;
}

function lessonOf(id){ return LESSONS.find(l=>l.id===id); }

// Etapa de una frase: 🌱 nueva (no introducida) · 🌿 en estudio · 🌳 firme (intervalo ≥ 7 días)
function stage(it){ if(!it) return {k:"seed",em:"🌱",t:"nueva"}; if(it.interval>=7) return {k:"tree",em:"🌳",t:"firme"}; return {k:"sprout",em:"🌿",t:"en estudio"}; }
function daysUntil(due){ const a=new Date(todayStr()+"T12:00:00"), b=new Date(due+"T12:00:00"); return Math.round((b-a)/86400000); }
function dueLabel(it){ const d=daysUntil(it.due); return d<=0?"vence hoy":d===1?"vuelve mañana":`vuelve en ${d} días`; }
function stageBar(items,m){ const c={seed:0,sprout:0,tree:0}; for(const it of items) c[stage(m[it.key]).k]++; const n=items.length||1; return `<div class="sbar" title="🌳 ${c.tree} · 🌿 ${c.sprout} · 🌱 ${c.seed}"><i class="t" style="width:${c.tree/n*100}%"></i><i class="s" style="width:${c.sprout/n*100}%"></i></div><small class="slegend">🌳 ${c.tree} · 🌿 ${c.sprout} · 🌱 ${c.seed}</small>`; }

// ---------- GAUR (ronda diaria por repetición espaciada) ----------
function dueToday(){ const t=todayStr(); return ITEMS.filter(i=>i.due<=t).sort((a,b)=>a.due<b.due?-1:a.due>b.due?1:b.lapses-a.lapses); }
function nextNew(n){
  const known=new Set(ITEMS.map(i=>i.key)); const out=[];
  for(const l of LESSONS){ for(const it of lessonItems(l)) if(!known.has(it.key)){ out.push(it); if(out.length>=n) return out; } if(out.length) return out; }
  return out;
}

   </div>`;

    <div class="card stack" style="gap:10px"><p class="hint">Los dos respondéis las mismas 6 frases escribiendo. Gana quien acierte más a la primera.</p><div class="row"><select class="ans" id="duelTo" style="flex:1">${users.map(u=>`<option value="${esc(u)}">${esc(u)}</option>`).join("")}</select><button class="btn red sm" id="duel">Erronka!</button></div></div>
    <p class="eyebrow">Elkarrekin · tareas en persona</p>
    ${tasks.length?`<div class="card stack" style="gap:10px"><p class="hint">Haz la tarea con la otra persona (en el café, por mensaje…), escribe aquí lo que te dijo en euskera y ella confirma si está bien.</p><select class="ans" id="taskTo">${users.map(u=>`<option value="${esc(u)}">${esc(u)}</option>`).join("")}</select><select class="ans" id="taskSel">${tasks.map((t,i)=>`<option value="${i}">${esc(t.t.replace("{X}","…"))}</option>`).join("")}</select><input class="ans" id="taskAns" placeholder="Lo que respondió, en euskera"><button class="btn sm" id="sendTask">Bidali · enviar</button></div>`:`<p class="hint">Las tareas en persona se desbloquean al introducir las lecciones de presentarse, qué tal, edad…</p>`}`}
    ${chs.length?`<p class="eyebrow">Historia · retos y tareas</p>${chs.map(c=>renderChallenge(c)).join("")}`:""}`;
  const d=document.getElementById("duel"); if(d) d.onclick=()=>{ const to=document.getElementById("duelTo").value; const pool=catalog().filter(i=>m[i.key]); const items=shuffle(pool.length>=6?pool:catalog()).slice(0,6).map(i=>({key:i.key,eu:i.eu,es:i.es,emoji:i.emoji||""})); startSession({items,label:"Erronka vs "+to,challenge:{to,items}}); };
  const st=document.getElementById("sendTask"); if(st) st.onclick=async()=>{ const to=document.getElementById("taskTo").value, t=tasks[+document.getElementById("taskSel").value], ans=document.getElementById("taskAns").value.trim(); if(!ans) return toast("Escribe la respuesta primero"); try{ await api("challenges",{to,kind:"task",payload:{text:t.t.replace("{X}",to),check:t.check},fromResult:{answer:ans}}); toast("Bidalita · enviado"); renderTeam(); }catch(e){ toast(e.message); } };
  app.querySelectorAll("[data-play]").forEach(b=>b.onclick=()=>{ const c=chs.find(x=>x.id===+b.dataset.play); startSession({items:c.payload.items,label:"Erronka de "+c.from,challenge:{id:c.id}}); });
  app.querySelectorAll("[data-ok]").forEach(b=>b.onclick=async()=>{ const id=+b.dataset.ok, fix=(app.querySelector(`[data-fix="${id}"]`)||{}).value||""; try{ await api(`challenges/${id}/result`,{result:{ok:b.dataset.v==="1",fix}}); renderTeam(); }catch(e){ toast(e.message); } });
}
function renderChallenge(c){
  const who=`<div class="who"><span class="av">${esc(c.from[0].toUpperCase())}</span>${esc(c.from)}${c.mine?" (tú)":""} <span class="muted">→</span> <span class="av">${esc(c.to[0].toUpperCase())}</span>${esc(c.to)}${c.forMe?" (tú)":""}</div>`;
  if(c.kind==="duel"){
    const a=c.fromResult, b=c.toResult;
    if(a&&b) return `<div class="ch">${who}<div class="vs"><b class="${a.score>b.score?"w":""}">${a.score}/${a.total}</b><span class="muted">vs</span><b class="${b.score>a.score?"w":""}">${b.score}/${b.total}</b></div><p class="hint" style="text-align:center">${a.score===b.score?"Berdinketa · empate":(a.score>b.score?c.from:c.to)+" irabazle · gana"}</p></div>`;
    if(c.forMe&&!b) return `<div class="ch">${who}<p>${esc(c.from)} te reta: 6 frases escribiendo. ${a?`Ya ha hecho ${a.score}/${a.total}.`:""}</p><button class="btn red sm" data-play="${c.id}">Onartu · jugar</button></div>`;
    return `<div class="ch">${who}<p class="hint">Tu resultado: ${a?a.score+"/"+a.total:"–"}. Esperando a ${esc(c.to)}.</p></div>`;
  }
  const r=c.toResult, mine=c.fromResult||{};
  return `<div class="ch">${who}<p style="font-size:15px">${esc(c.payload.text)}</p><p><b style="color:var(--red)">${esc(mine.answer||"")}</b></p>
    ${r?`<p class="hint">${r.ok?"✅ Confirmado por "+esc(c.to):"✏️ Corrección de "+esc(c.to)+": <b>"+esc(r.fix||"")+"</b>"}</p>`:c.forMe?`<p class="hint">¿Es lo que dijiste? Si no, escribe la forma correcta.</p><input class="ans" data-fix="${c.id}" placeholder="Corrección (opcional)"><div class="row"><button class="btn sm" data-ok="${c.id}" data-v="1">Zuzena ✓</button><button class="btn ghost sm" data-ok="${c.id}" data-v="0">Corregir</button></div>`:`<p class="hint">Esperando confirmación de ${esc(c.to)}.</p>`}</div>`;
}
async function finishChallenge(score,total){
  const c=SES.challenge; const answers=SES.answers;
  try{
    if(c.id) await api(`challenges/${c.id}/result`,{result:{score,total}});
    else await api("challenges",{to:c.to,kind:"duel",payload:{items:c.items},fromResult:{score,total}});
    P=await api("round",{lessonId:null,ok:score,total:Math.max(total,1)});
  }catch(e){ toast(e.message); }
  app.innerHTML=`<div class="head pad" style="padding-bottom:28px;text-align:center"><div class="lb">${LAUBURU}</div><p class="eyebrow">Erronka amaituta</p><h1 style="margin-top:6px">${score}/${total}</h1><p style="color:#F6C9C2;margin-top:8px">${c.id?"Resultado enviado. Mira el marcador en Taldea.":"Reto enviado. Cuando conteste, veréis el marcador en Taldea."}</p></div>${HILLS}<div class="stack pad" style="padding-top:18px"><button class="btn" id="home">Taldera · ir a Taldea</button></div>`;
  document.getElementById("home").onclick=()=>setTab("taldea");
}

// ---------- DATUAK ----------
async function renderStats(){
  app.innerHTML=header("Datuak · lo que de verdad se queda")+`<div class="stack pad" style="padding-top:18px"><p class="muted">Kargatzen…</p></div>`;
  let data; try{ data=await api("stats"); }catch(e){ app.querySelector(".stack").innerHTML=`<p class="err">No se pudieron cargar los datos.</p>`; return; }
  const COLORS=["#B8281F","#2A7A4F","#D9A441","#3B6EA5","#8E4A9E","#C8683A"];
  const users=data.users.slice().sort((a,b)=>b.consolidated-a.consolidated||b.weekXp-a.weekXp).map((u,i)=>({...u,color:COLORS[i%COLORS.length]}));
  const active=users.filter(u=>u.weekXp>0||u.me); const me=users.find(u=>u.me);
  const dayLabel=d=>["Ig","Al","Ar","Az","Og","Ol","Lr"][new Date(d+"T12:00:00").getDay()];
  const maxC=Math.max(1,...users.map(u=>u.learned)); const mx=Math.max(1,...users.flatMap(u=>u.perDay));
  const best=k=>Math.max(...users.map(u=>u[k])); const cell=(u,k,f=x=>x)=>`<td class="${u[k]===best(k)&&u[k]>0?"win":""}">${f(u[k])}</td>`;
  const m=imap(); const soon=ITEMS.filter(i=>i.due>data.days[6]).length;
  app.querySelector(".stack").innerHTML=`
    <div class="stats"><div class="stat"><b>🌳 ${me.consolidated}</b><span>firmes</span></div><div class="stat"><b>${me.learned}</b><span>en estudio</span></div><div class="stat"><b>🔥 ${me.streak}</b><span>días seguidos</span></div><div class="stat"><b>${me.accuracy}%</b><span>a la primera</span></div></div>
    <p class="hint">Firme = la has acertado tantas veces que no vuelve hasta dentro de una semana o más. ${soon?`${soon} frases programadas para más adelante.`:""}</p>
    <p class="eyebrow">Taldea · firmes por persona</p>
    <div class="card lb-list">${users.map((u,i)=>`<div class="lbrow ${u.me?"me":""}"><span class="rank">${["🥇","🥈","🥉"][i]||(i+1)}</span><span class="av" style="background:${u.color}">${esc(u.name[0].toUpperCase())}</span><span class="who"><b>${esc(u.name)}${u.me?" (tú)":""}</b>${u.practicedToday?" <span class='muted' style='font-size:13px'>· gaur 🔥</span>":""}<i class="wbar"><i style="width:${Math.round(u.learned/maxC*100)}%;background:${u.color};opacity:.4"></i></i><i class="wbar" style="margin-top:-6px;background:transparent"><i style="width:${Math.round(u.consolidated/maxC*100)}%;background:${u.color}"></i></i></span><b class="num">${u.consolidated}<span class="muted" style="font-size:13px;font-family:var(--body)"> / ${u.learned}</span></b></div>`).join("")}</div>
    <p class="hint">Barra clara: frases en estudio. Barra oscura: firmes.</p>
    <p class="eyebrow">Azken 7 egunak · XP por día</p>
    <div class="card"><div class="chart">${data.days.map((d,i)=>`<div class="d"><div class="bars">${active.map(u=>`<i style="height:${Math.round(u.perDay[i]/mx*100)}%;background:${u.color}" title="${esc(u.name)}: ${u.perDay[i]} XP"></i>`).join("")}</div><small>${dayLabel(d)}</small></div>`).join("")}</div><div class="legend" style="margin-top:10px">${active.map(u=>`<span><i style="background:${u.color}"></i>${esc(u.name)}</span>`).join("")}</div></div>
    <p class="eyebrow">Denak · todos</p>
    <div class="tabwrap"><table class="stab"><tr><th></th><th>🌳</th><th>Ikasten</th><th>Astea</th><th>Guztira</th><th>🔥</th><th>%</th></tr>${users.map(u=>`<tr class="${u.me?"me":""}"><td class="lab"><span class="dot" style="background:${u.color}"></span>${esc(u.name)}</td>${cell(u,"consolidated")}${cell(u,"learned")}${cell(u,"weekXp")}${cell(u,"xp")}${cell(u,"streak")}${cell(u,"accuracy",x=>x+"%")}</tr>`).join("")}</table></div>
    <p class="hint">🌳 firmes · Ikasten = en estudio · Astea = XP de la semana · Guztira = XP total · % = aciertos a la primera.</p>`;
}
