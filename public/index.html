<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Euskara Praktika</title>
<meta name="theme-color" content="#1F5F4A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Euskara">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Domine:wght@600;700&family=Nunito+Sans:wght@400;600;700;800&display=swap">
<style>
:root{
  --bg:#F3F5F0; --card:#FFFFFF; --ink:#1A2430; --muted:#5B6878; --line:#D9DED3;
  --green:#1F5F4A; --green-soft:#DCEFE5; --red:#C8402A; --red-soft:#F9DEDA; --gold:#E0A526; --gold-soft:#FBEFD0;
  --display:'Domine',Georgia,serif; --body:'Nunito Sans',system-ui,-apple-system,sans-serif; --r:16px; color-scheme:light;
}
@media (prefers-color-scheme:dark){ :root{ --bg:#121A1C; --card:#1C2628; --ink:#EEF2EC; --muted:#A3B0A9; --line:#2F3D3E; --green:#5FBF93; --green-soft:#1E3A30; --red:#F07A62; --red-soft:#4A241E; --gold:#F0BF4A; --gold-soft:#443619; color-scheme:dark } }
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.4;-webkit-font-smoothing:antialiased;padding-top:env(safe-area-inset-top,0px)}
.app{max-width:560px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 24px}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;line-height:1.15}
h1{font-size:30px} h2{font-size:24px} h3{font-size:19px}
p{margin:0}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible,input:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.btn{display:block;width:100%;padding:16px;border-radius:14px;font-weight:800;font-size:18px;text-align:center;background:var(--green);color:#fff}
.btn.ghost{background:transparent;color:var(--green);border:2px solid var(--green)}
.btn:disabled{opacity:.4}
.eyebrow{font-size:12px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;align-items:center;gap:12px}
.spacer{flex:1}
.err{color:var(--red);font-weight:700;min-height:1.4em}
.top{display:flex;align-items:center;gap:12px;padding-block:8px 16px}
.top .bar{flex:1;height:12px;background:var(--line);border-radius:999px;overflow:hidden}
.top .bar i{display:block;height:100%;width:0;background:var(--green);border-radius:999px;transition:width .3s}
.pill{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;font-weight:800;font-size:14px;background:var(--gold-soft);color:var(--ink);white-space:nowrap}
.pill.g{background:var(--green-soft)}
.lesson{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.lesson .n{width:44px;height:44px;border-radius:50%;background:var(--green-soft);color:var(--green);font-family:var(--display);font-weight:700;font-size:20px;display:grid;place-items:center;flex:none}
.lesson .n.done{background:var(--green);color:#fff}
.lesson .t{flex:1;min-width:0}
.lesson .t small{display:block;color:var(--muted);font-size:14px}
.lesson .mini{display:block;height:6px;background:var(--line);border-radius:999px;margin-top:8px;overflow:hidden}
.lesson .mini i{display:block;height:100%;background:var(--green);width:0}
.prompt{font-size:26px;font-weight:800;line-height:1.25}
.prompt.eu{font-family:var(--display);font-weight:700}
.opts{display:grid;gap:10px}
.opt{text-align:left;padding:16px;border-radius:14px;border:2px solid var(--line);background:var(--card);font-size:18px;font-weight:600}
.opt[aria-pressed="true"]{border-color:var(--green);background:var(--green-soft)}
.opt.ok{border-color:var(--green);background:var(--green-soft)}
.opt.bad{border-color:var(--red);background:var(--red-soft)}
.tiles{display:flex;flex-wrap:wrap;gap:8px;min-height:60px;padding:10px;border-bottom:2px solid var(--line)}
.tiles.bank{border:0;padding-top:16px}
.tile{padding:10px 14px;border-radius:12px;border:2px solid var(--line);background:var(--card);font-size:18px;font-weight:600;box-shadow:0 2px 0 var(--line)}
.tile.used{opacity:.25;pointer-events:none}
input.ans{width:100%;font:inherit;font-size:20px;padding:14px 16px;border-radius:14px;border:2px solid var(--line);background:var(--card);color:var(--ink)}
.hint{font-size:14px;color:var(--muted)}
.sheet{position:fixed;left:0;right:0;bottom:0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px calc(18px + env(safe-area-inset-bottom,0px));z-index:20;transform:translateY(110%);transition:transform .25s}
.sheet.show{transform:none}
.sheet .in{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
.sheet.ok{background:var(--green-soft)} .sheet.bad{background:var(--red-soft)}
.sheet h3{font-family:var(--body);font-weight:800;font-size:20px}
.sheet.ok h3{color:var(--green)} .sheet.bad h3{color:var(--red)}
.sheet.bad .btn{background:var(--red)}
.bottom{position:sticky;bottom:0;padding-block:12px calc(8px + env(safe-area-inset-bottom,0px));background:var(--bg)}
.big{font-family:var(--display);font-size:56px;font-weight:700;line-height:1;color:var(--green);font-variant-numeric:tabular-nums}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;text-align:center}
.stat b{display:block;font-family:var(--display);font-size:28px;font-variant-numeric:tabular-nums}
.stat span{font-size:13px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.08em}
.avatar{width:44px;height:44px;border-radius:50%;background:var(--green);color:#fff;display:grid;place-items:center;font-family:var(--display);font-size:20px;flex:none}
.link{color:var(--green);font-weight:700;text-decoration:underline;text-underline-offset:3px}
.board p{display:flex;justify-content:space-between;padding:8px 0;border-top:1px solid var(--line)}
@media (prefers-reduced-motion:reduce){ .sheet,.top .bar i{transition:none} }
</style>
</head>
<body>
<div class="app" id="app"></div>
<div class="sheet" id="sheet"><div class="in"><h3 id="sh-title"></h3><p id="sh-body"></p><button class="btn" id="sh-next">Continuar</button></div></div>

<script src="lessons.js"></script>
<script>
const ROUND = 10, XP_OK = 10;
const app = document.getElementById("app");
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const shuffle = a => { a=a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; };
const norm = s => s.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[¿?¡!.,]/g,"").replace(/\s+/g," ").trim();
const words = s => s.replace(/[¿?¡!.,]/g,"").split(/\s+/).filter(Boolean);
async function api(path, body){
  const r = await fetch("/api/"+path, body ? {method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)} : {});
  const data = await r.json().catch(()=>({error:"Error de red."}));
  if(!r.ok) throw Object.assign(new Error(data.error||"Error"), data);
  return data;
}
let P = null; // perfil actual

// ---------- LOGIN ----------
function renderLogin(mode="login", prefill={}){
  const reg = mode==="register";
  app.innerHTML = `
   <div class="stack" style="padding-top:48px">
    <p class="eyebrow">Euskara praktika</p>
    <h1>${reg?"Crea tu cuenta":"Nor zara?"}</h1>
    <p class="muted">${reg?"Elige un nombre y un PIN de 4 cifras. Lo usarás en cualquier teléfono.":"¿Quién eres? Entra con tu nombre y tu PIN."}</p>
    <form id="f" class="stack">
      <input class="ans" id="name" placeholder="Nombre" autocomplete="username" autocapitalize="none" value="${esc(prefill.name||"")}">
      <input class="ans" id="pin" placeholder="PIN" inputmode="numeric" pattern="[0-9]*" type="password" autocomplete="${reg?"new-password":"current-password"}" value="${esc(prefill.pin||"")}">
      ${reg?`<input class="ans" id="invite" placeholder="Código de invitación" autocomplete="off" autocapitalize="none">`:""}
      <p class="err" id="err"></p>
      <button class="btn" type="submit">${reg?"Crear cuenta":"Entrar"}</button>
    </form>
    <button class="link" id="swap">${reg?"Ya tengo cuenta":"Crear una cuenta nueva"}</button>
   </div>`;
  document.getElementById("swap").onclick=()=>renderLogin(reg?"login":"register");
  document.getElementById("f").onsubmit=async e=>{
    e.preventDefault(); const name=document.getElementById("name").value, pin=document.getElementById("pin").value, invite=(document.getElementById("invite")||{}).value||""; const err=document.getElementById("err"); err.textContent="";
    try{ P = await api(reg?"register":"login",{name,pin,invite}); renderHome(); }
    catch(ex){ if(ex.unknown){ renderLogin("register",{name,pin}); document.getElementById("err").textContent="No existe ese usuario. ¿Quieres crearlo?"; } else err.textContent=ex.message; }
  };
}

// ---------- INICIO ----------
async function renderHome(){
  const learned = LESSONS.filter(l=>(P.lessons[l.id]||{}).rounds>0);
  app.innerHTML = `
   <div class="stack">
    <div class="row" style="padding-block:8px">
     <span class="avatar">${esc(P.name[0].toUpperCase())}</span>
     <div style="min-width:0"><h2 style="font-size:22px">Kaixo, ${esc(P.name)}!</h2><button class="link" id="logout" style="font-size:14px">Salir</button></div>
     <span class="spacer"></span>
     <span class="pill" title="Racha de días">🔥 ${P.streak}</span>
     <span class="pill g">${P.xp} XP</span>
    </div>
    ${P.practicedToday?"":`<p class="hint">Hoy todavía no has practicado. Una ronda mantiene la racha.</p>`}
    <p class="eyebrow">Lecciones</p>
    ${LESSONS.map((l,i)=>{ const st=P.lessons[l.id]||{rounds:0,best:0}; const pct=Math.min(100,Math.round(st.rounds/3*100)); return `<button class="lesson" data-l="${l.id}"><span class="n ${pct>=100?"done":""}">${i+1}</span><span class="t"><b>${esc(l.title)}</b><small>${esc(l.desc)}${st.rounds?` · ${st.rounds} ${st.rounds===1?"ronda":"rondas"} · mejor ${st.best}/${ROUND}`:""}</small><span class="mini"><i style="width:${pct}%"></i></span></span></button>`; }).join("")}
    <p class="eyebrow" style="margin-top:8px">Repaso</p>
    <button class="btn ghost" id="review" ${learned.length<1?"disabled":""}>Repasar todo lo visto${learned.length?` (${learned.length} ${learned.length===1?"lección":"lecciones"})`:""}</button>
    <div class="card board" id="board"><p class="eyebrow" style="border:0;padding:0 0 6px">Ranking</p></div>
   </div>`;
  document.getElementById("logout").onclick=async()=>{ await api("logout",{}); P=null; renderLogin(); };
  app.querySelectorAll("[data-l]").forEach(b=>b.onclick=()=>startSession([LESSONS.find(l=>l.id===b.dataset.l)]));
  document.getElementById("review").onclick=()=>startSession(learned,true);
  try{ const board=await api("board"); document.getElementById("board").insertAdjacentHTML("beforeend", board.map(u=>`<p><span>${esc(u.name)}</span><b>${u.xp} XP</b></p>`).join("")); }catch(e){}
}

// ---------- EJERCICIOS ----------
function buildExercises(lessons){
  const pool=[]; const allPairs=lessons.flatMap(l=>l.pairs); const allSent=lessons.flatMap(l=>l.sentences);
  const allEuWords=[...new Set(allSent.flatMap(s=>words(s[0])))];
  for(const [eu,es] of allPairs){
    pool.push({type:"choice",dir:"eu-es",q:eu,a:es,opts:shuffle([es,...shuffle(allPairs.filter(p=>p[1]!==es).map(p=>p[1])).slice(0,3)])});
    pool.push({type:"choice",dir:"es-eu",q:es,a:eu,opts:shuffle([eu,...shuffle(allPairs.filter(p=>p[0]!==eu).map(p=>p[0])).slice(0,3)])});
  }
  for(const [eu,es] of allSent){
    const w=words(eu); const distract=shuffle(allEuWords.filter(x=>!w.includes(x))).slice(0,3);
    pool.push({type:"tiles",q:es,a:eu,tiles:shuffle([...w,...distract])});
    pool.push({type:"type",q:es,a:eu});
  }
  const take=(t,n)=>shuffle(pool.filter(x=>x.type===t)).slice(0,n);
  let ex=[...take("choice",5),...take("tiles",3),...take("type",2)];
  if(ex.length<ROUND) ex=ex.concat(shuffle(pool.filter(x=>!ex.includes(x))).slice(0,ROUND-ex.length));
  return shuffle(ex).slice(0,ROUND);
}
let SES=null;
function startSession(lessons, review=false){ SES={lessons,review,ex:buildExercises(lessons),i:0,ok:0,wrong:[]}; renderExercise(); }
function renderExercise(){
  const e=SES.ex[SES.i]; const pct=Math.round(SES.i/SES.ex.length*100);
  let body="";
  if(e.type==="choice") body=`<p class="eyebrow">${e.dir==="eu-es"?"¿Qué significa?":"¿Cómo se dice en euskera?"}</p><p class="prompt ${e.dir==="eu-es"?"eu":""}">${esc(e.q)}</p><div class="opts">${e.opts.map((o,k)=>`<button class="opt" data-k="${k}" aria-pressed="false">${esc(o)}</button>`).join("")}</div>`;
  else if(e.type==="tiles") body=`<p class="eyebrow">Ordena las fichas</p><p class="prompt">${esc(e.q)}</p><div class="tiles" id="answer" aria-label="Tu respuesta"></div><div class="tiles bank" id="bank">${e.tiles.map((t,k)=>`<button class="tile" data-k="${k}">${esc(t)}</button>`).join("")}</div>`;
  else body=`<p class="eyebrow">Escríbelo en euskera</p><p class="prompt">${esc(e.q)}</p><input class="ans" id="typed" autocomplete="off" autocapitalize="sentences" placeholder="Escribe aquí…"><p class="hint">No importan tildes ni signos de puntuación.</p>`;
  app.innerHTML=`<div class="top"><button id="quit" aria-label="Salir" style="font-size:22px;color:var(--muted)">✕</button><div class="bar"><i style="width:${pct}%"></i></div><span class="pill g">${SES.ok*XP_OK} XP</span></div>
   <div class="stack" style="flex:1">${body}</div>
   <div class="bottom"><button class="btn" id="check" disabled>Comprobar</button></div>`;
  document.getElementById("quit").onclick=()=>renderHome();
  const check=document.getElementById("check"); let picked=null; const chosen=[];
  if(e.type==="choice"){
    app.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{ app.querySelectorAll(".opt").forEach(x=>x.setAttribute("aria-pressed","false")); b.setAttribute("aria-pressed","true"); picked=e.opts[+b.dataset.k]; check.disabled=false; });
  } else if(e.type==="tiles"){
    const ans=document.getElementById("answer"), bank=document.getElementById("bank");
    const redraw=()=>{ ans.innerHTML=chosen.map((k,i)=>`<button class="tile" data-i="${i}">${esc(e.tiles[k])}</button>`).join(""); ans.querySelectorAll(".tile").forEach(b=>b.onclick=()=>{ const k=chosen.splice(+b.dataset.i,1)[0]; bank.querySelector(`[data-k="${k}"]`).classList.remove("used"); redraw(); }); check.disabled=chosen.length===0; };
    bank.querySelectorAll(".tile").forEach(b=>b.onclick=()=>{ chosen.push(+b.dataset.k); b.classList.add("used"); redraw(); });
  } else {
    const inp=document.getElementById("typed"); inp.oninput=()=>check.disabled=!inp.value.trim(); inp.onkeydown=ev=>{ if(ev.key==="Enter"&&inp.value.trim()) check.click(); }; setTimeout(()=>inp.focus(),50);
  }
  check.onclick=()=>{
    let given; if(e.type==="choice") given=picked; else if(e.type==="tiles") given=chosen.map(k=>e.tiles[k]).join(" "); else given=document.getElementById("typed").value;
    const ok = norm(given)===norm(e.a);
    if(e.type==="choice") app.querySelectorAll(".opt").forEach(b=>{ const v=e.opts[+b.dataset.k]; if(v===e.a) b.classList.add("ok"); else if(v===picked&&!ok) b.classList.add("bad"); });
    check.disabled=true; if(ok) SES.ok++; else SES.wrong.push(e);
    showSheet(ok,e);
  };
}
function showSheet(ok,e){
  const sh=document.getElementById("sheet"); sh.className="sheet show "+(ok?"ok":"bad");
  document.getElementById("sh-title").textContent= ok ? ["Oso ondo!","Ederki!","Primeran!","Bikain!"][Math.floor(Math.random()*4)] : "Casi. La respuesta correcta:";
  document.getElementById("sh-body").textContent= ok ? (e.type==="choice"?`${e.q} = ${e.a}`:e.a) : e.a;
  const next=document.getElementById("sh-next");
  next.onclick=()=>{ sh.className="sheet"; SES.i++; if(SES.i<SES.ex.length) renderExercise(); else finish(); };
  next.focus();
}
async function finish(){
  const acc=Math.round(SES.ok/SES.ex.length*100);
  let gained=SES.ok*XP_OK, saved=true;
  try{ const r=await api("round",{lessonId:SES.review?null:SES.lessons[0].id, ok:SES.ok, total:SES.ex.length}); gained=r.gained; P=r; }catch(e){ saved=false; }
  app.innerHTML=`<div class="stack" style="padding-top:40px;text-align:center">
    <p class="eyebrow">Ronda terminada</p>
    <h1>${acc===100?"Bikain!":acc>=70?"Ondo egin!":"Segi aurrera!"}</h1>
    <p class="big">+${gained} XP</p>
    <div class="stats"><div class="stat"><b>${SES.ok}/${SES.ex.length}</b><span>aciertos</span></div><div class="stat"><b>🔥 ${P.streak}</b><span>racha (días)</span></div></div>
    ${saved?"":`<p class="err">No se pudo guardar la ronda (sin conexión). Vuelve a entrar y repítela.</p>`}
    ${SES.wrong.length?`<div class="card" style="text-align:left"><p class="eyebrow" style="margin-bottom:8px">Para repasar</p>${SES.wrong.map(w=>`<p style="padding:6px 0;border-top:1px solid var(--line)"><b>${esc(w.a)}</b><br><span class="muted">${esc(w.q)}</span></p>`).join("")}</div>`:""}
    <button class="btn" id="again">${SES.wrong.length?"Otra ronda para afianzar":"Otra ronda"}</button>
    <button class="btn ghost" id="home">Volver al inicio</button>
   </div>`;
  document.getElementById("again").onclick=()=>startSession(SES.lessons,SES.review);
  document.getElementById("home").onclick=renderHome;
}

// arranque: ¿hay sesión?
api("me").then(p=>{ P=p; renderHome(); }).catch(()=>renderLogin());
if("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
</body>
</html>
